sonar.projectKey=build-a-software-factory_architecture-review
sonar.projectName=architecture-review

# Source and test roots
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclude the student's Tetris practice target, dependencies, build output,
# and fetched/generated content that isn't maintained in this repo.
sonar.exclusions=\
  tetris/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  factory/spec/**,\
  factory/runs/**,\
  **/*.d.ts

# Keep coverage/duplication analysis off generated and fetched content too.
sonar.coverage.exclusions=\
  tetris/**,\
  factory/spec/**

sonar.cpd.exclusions=\
  tetris/**,\
  factory/spec/**

# TypeScript sources live under factory/
sonar.typescript.tsconfigPath=factory/tsconfig.json
